[project]
name = "shui-collab"
version = "0.1.0"
description = "Shui! Shared coding-agent sessions for collaborative research."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.18,<1", "cryptography>=44,<51"]

[project.urls]
Homepage = "https://stonezhang.com/shui/"
Repository = "https://github.com/tongmd/Shui"
Issues = "https://github.com/tongmd/Shui/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
shui = "shui.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shui"]

[tool.setuptools.data-files]
"share/shui/web" = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.png", "web/*.ico", "web/LUCIDE_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
